[project]
name = "heat-pipe-backend"
version = "0.1.0"
description = "Vertical Heat Pipe Selection API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "reportlab>=4.0,<5",
    "httpx==0.28.1"
]

[tool.vercel]
entrypoint = "app.main:app"
